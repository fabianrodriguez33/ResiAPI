spring.application.name=ResiAPI-test

# Base de pruebas separada (resiup_test) en el PostgreSQL de Docker. La clave llega por DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME_TEST:resiup_test}
spring.datasource.username=${DB_USER:resiup}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Secretos exclusivos de pruebas (no son los reales)
resi.jwt.secret=secreto-solo-para-pruebas-automatizadas-0123456789
resi.jwt.expiracion-segundos=3600
resi.qr.secreto=secreto-qr-solo-para-pruebas-0123456789abcdef
resi.zona-horaria=America/Lima
resi.admin.usuario=
resi.admin.clave=
resi.evidencias.directorio=target/evidencias-prueba
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
