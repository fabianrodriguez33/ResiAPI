spring.application.name=ResiAPI
server.port=${SERVER_PORT:8080}

# Base de datos (valores desde variables de entorno; ver .env.example)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resiup}
spring.datasource.username=${DB_USER:resiup}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# JWT (HS256). JWT_SECRET: mínimo 32 caracteres, obligatorio; nunca versionar.
resi.jwt.secret=${JWT_SECRET}
resi.jwt.expiracion-segundos=3600
resi.zona-horaria=America/Lima

# Ofuscar detalles de error al cliente
server.error.include-message=never
server.error.include-stacktrace=never
resi.qr.secreto=${QR_SECRET}
resi.admin.usuario=${ADMIN_USUARIO:}
resi.admin.clave=${ADMIN_CLAVE:}
resi.evidencias.directorio=${EVIDENCIAS_DIR:./evidencias}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
